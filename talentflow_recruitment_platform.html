<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalentFlow — Recruitment Workspace</title>
<style>
:root{--ink:#182238;--muted:#718096;--line:#e7ebf2;--bg:#f5f7fb;--purple:#6558d9;--lav:#efedff;--green:#16856b;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:10px 14px;font-weight:650}.primary{background:var(--purple);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.danger{color:#b42318;background:#fff1f0}
.app{display:flex;min-height:100vh}.sidebar{width:235px;background:#fff;border-right:1px solid var(--line);padding:25px 16px;flex-shrink:0}.brand{display:flex;gap:10px;align-items:center;font-weight:800;font-size:19px;margin:0 9px 34px}.logo{width:34px;height:34px;background:var(--purple);color:#fff;border-radius:11px;display:grid;place-items:center;font-weight:900}.nav-label{color:#9aa4b5;font-size:10px;letter-spacing:1.5px;font-weight:800;padding:0 12px;margin:22px 0 8px}.nav{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;color:#65718a;margin:3px 0;font-weight:600;cursor:pointer}.nav:hover,.nav.active{background:var(--lav);color:var(--purple)}.side-bottom{position:sticky;top:90vh;margin-top:50px;padding:12px;color:var(--muted);font-size:12px}.main{min-width:0;flex:1}.topbar{height:76px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px}.crumb{color:var(--muted)}.avatar{background:#e9e6ff;color:var(--purple);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800}.content{max-width:1440px;margin:auto;padding:32px 34px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:26px}.pagehead h1{font-size:27px;letter-spacing:-.7px;margin:0 0 5px}.sub{color:var(--muted);margin:0}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}.stat-label{color:var(--muted);font-weight:600;font-size:12px}.stat-num{font-size:29px;font-weight:800;margin:9px 0 4px;letter-spacing:-1px}.stat-note{font-size:12px;color:var(--green)}.section-title{font-size:16px;margin:0 0 15px}.split{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:540px}th{text-align:left;color:#8792a6;font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:750;background:#fafbfe}th,td{padding:14px 12px;border-bottom:1px solid #edf0f5}td{font-size:13px}tr:last-child td{border-bottom:0}.person{display:flex;align-items:center;gap:10px;font-weight:700}.mini-avatar{width:34px;height:34px;border-radius:10px;background:#f0edff;color:var(--purple);display:grid;place-items:center;font-weight:800;flex-shrink:0}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#f0f2f7;color:#5f6b80;font-size:11px;font-weight:750}.pill.green{background:#e4f7ef;color:#13795b}.pill.purple{background:#efedff;color:#6558d9}.pill.amber{background:#fff3d8;color:#9a6700}.search{min-width:220px;flex:1;max-width:360px;border:1px solid var(--line);background:white;border-radius:10px;padding:10px 12px;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:#9b93ef;box-shadow:0 0 0 3px #efedff;outline:none}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:17px}.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;padding:10px 11px;background:#fff;width:100%;color:var(--ink)}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.field label{font-size:12px;font-weight:750;color:#59657a}.field textarea{min-height:78px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.span2{grid-column:span 2}.empty{padding:30px;text-align:center;color:var(--muted)}.progress{height:7px;background:#edf0f7;border-radius:20px;overflow:hidden}.progress span{height:100%;display:block;background:var(--purple);border-radius:20px}.match-layout{display:grid;grid-template-columns:340px 1fr;gap:18px}.matchscore{font-size:42px;font-weight:850;color:var(--purple);letter-spacing:-2px}.skill{display:inline-block;margin:4px 4px 0 0;padding:6px 9px;background:#e4f7ef;color:#13795b;border-radius:7px;font-size:12px}.missing{background:#fff3d8;color:#946200}.pipeline{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:12px;overflow:auto;padding-bottom:8px}.stage{background:#eef1f7;border-radius:14px;padding:12px;min-height:280px}.stagehead{display:flex;justify-content:space-between;font-weight:800;font-size:12px;margin-bottom:12px}.candidate-card{background:white;border:1px solid var(--line);border-radius:11px;padding:13px;margin-bottom:9px}.candidate-card strong{display:block;margin:7px 0 3px}.candidate-card select{width:100%;margin-top:10px;padding:8px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:12px}.barrow{display:grid;grid-template-columns:125px 1fr 38px;gap:10px;align-items:center;margin:14px 0;font-size:12px}.bar{height:9px;border-radius:20px;background:#eef0f7;overflow:hidden}.bar span{display:block;height:100%;background:var(--purple);border-radius:20px}.note{background:#f6f5ff;border:1px solid #e5e1ff;border-radius:12px;padding:14px;color:#4e477f;font-size:12px}.toast{position:fixed;bottom:20px;right:20px;background:#182238;color:white;padding:12px 17px;border-radius:11px;display:none;box-shadow:0 8px 30px #1720332b;z-index:9}.modalback{position:fixed;inset:0;background:#11182770;display:none;align-items:center;justify-content:center;padding:20px;z-index:5}.modal{background:white;border-radius:16px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:24px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{margin:0;font-size:20px}.close{background:#f1f3f8;padding:7px 11px}.footerhint{font-size:11px;color:#9aa4b5;margin-top:18px}
@media(max-width:1050px){.sidebar{width:190px}.grid{grid-template-columns:repeat(2,1fr)}.split,.match-layout{grid-template-columns:1fr}.pipeline{grid-template-columns:repeat(5,205px)}}@media(max-width:700px){.sidebar{width:62px;padding:18px 7px}.brand{margin:0 6px 30px}.brandname,.nav span,.nav-label,.side-bottom{display:none}.nav{justify-content:center;padding:12px 6px;font-size:17px}.topbar{padding:0 16px}.content{padding:23px 15px}.grid{gap:10px}.card{padding:15px}.pagehead{flex-direction:column}.formgrid{grid-template-columns:1fr}.span2{grid-column:span 1}.topbar .crumb{font-size:12px}}
</style></head>
<body><div class="app">
<aside class="sidebar"><div class="brand"><div class="logo">T</div><span class="brandname">TalentFlow</span></div>
<div class="nav-label">WORKSPACE</div>
<div class="nav active" data-page="Dashboard"><span>▦</span><span>Dashboard</span></div>
<div class="nav" data-page="Jobs"><span>▤</span><span>Jobs</span></div>
<div class="nav" data-page="Candidates"><span>♙</span><span>Candidates</span></div>
<div class="nav" data-page="Matching"><span>✧</span><span>AI Matching</span></div>
<div class="nav" data-page="Pipeline"><span>⇢</span><span>Hiring Pipeline</span></div>
<div class="nav-label">ANALYTICS</div><div class="nav" data-page="Insights"><span>▥</span><span>Insights</span></div>
<div class="side-bottom">Recruitment workspace<br><b>Demo prototype · v1.0</b></div></aside>
<main class="main"><header class="topbar"><div class="crumb">Workspace <span class="muted">/</span> <b id="crumb">Dashboard</b></div><div class="row"><span class="pill purple">AI DEMO</span><div class="avatar">HR</div></div></header><div class="content" id="view"></div></main></div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h2 id="modalTitle">Add record</h2><button class="secondary close" onclick="closeModal()">✕</button></div><div id="modalBody"></div></div></div><div class="toast" id="toast"></div>
<script>
const stages=['New','Screening','Interview','Offer','Hired'];
const seedJobs=[
{id:1,title:'International Relations Analyst',dept:'Strategy & Research',location:'Tashkent · Hybrid',type:'Full-time',skills:['Research','Policy Analysis','English','Report Writing'],status:'Open',date:'Oct 12, 2026'},
{id:2,title:'Talent Acquisition Specialist',dept:'People & Culture',location:'Tashkent · On-site',type:'Full-time',skills:['Recruitment','Communication','Excel','Interviewing'],status:'Open',date:'Oct 10, 2026'},
{id:3,title:'Junior Data Analyst',dept:'Analytics',location:'Remote',type:'Internship',skills:['Excel','SQL','Data Analysis','Python'],status:'Open',date:'Oct 08, 2026'}];
const seedCandidates=[
{id:1,name:'Madina Karimova',email:'madina@example.com',role:'Research Assistant',skills:['Research','English','Report Writing','Communication'],experience:'2 years',stage:'Screening',jobId:1},
{id:2,name:'Daniel Lee',email:'daniel@example.com',role:'Recruiting Coordinator',skills:['Recruitment','Communication','Excel','Interviewing'],experience:'3 years',stage:'Interview',jobId:2},
{id:3,name:'Sofia Chen',email:'sofia@example.com',role:'Business Intern',skills:['Excel','SQL','Data Analysis'],experience:'1 year',stage:'New',jobId:3}];
let jobs,candidates,page='Dashboard',matchJob='1',matchCandidate='1',query='',stageFilter='All';
try{jobs=JSON.parse(localStorage.getItem('tf_jobs'))||seedJobs;candidates=JSON.parse(localStorage.getItem('tf_candidates'))||seedCandidates}catch(e){jobs=seedJobs;candidates=seedCandidates}
function save(){try{localStorage.setItem('tf_jobs',JSON.stringify(jobs));localStorage.setItem('tf_candidates',JSON.stringify(candidates))}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function initials(n){return n.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function setPage(p){page=p;query='';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));document.getElementById('crumb').textContent=p;render()}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>setPage(n.dataset.page));
function header(title,sub,btn=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="sub">${sub}</p></div>${btn}</div>`}
function stats(label,num,note){return `<div class="card"><div class="stat-label">${label}</div><div class="stat-num">${num}</div><div class="stat-note">${note}</div></div>`}
function btn(label,fn,cls='primary'){return `<button class="${cls}" onclick="${fn}">${label}</button>`}
function jobName(id){return jobs.find(j=>j.id==id)?.title||'Unassigned'}
function candidateRows(list){return list.map(c=>`<tr><td><div class="person"><div class="mini-avatar">${initials(c.name)}</div><div>${esc(c.name)}<div class="muted" style="font-size:11px;font-weight:400">${esc(c.email)}</div></div></div></td><td>${esc(c.role)}</td><td>${esc(jobName(c.jobId))}</td><td><span class="pill ${c.stage==='Hired'?'green':c.stage==='Interview'?'purple':''}">${c.stage}</span></td><td>${btn('View',`viewCandidate(${c.id})`,'secondary')}</td></tr>`).join('')}
function render(){const v=document.getElementById('view');
if(page==='Dashboard'){v.innerHTML=header('Good morning, HR team 👋','Here’s what’s happening across your recruitment workspace.',btn('+ Add candidate',"openModal('candidate')"))+`<div class="grid">${stats('OPEN POSITIONS',jobs.filter(j=>j.status==='Open').length,'↗ Active job listings')}${stats('TOTAL CANDIDATES',candidates.length,'↗ In your talent pool')}${stats('INTERVIEWS',candidates.filter(c=>c.stage==='Interview').length,'↗ Candidates at interview')}${stats('HIRED',candidates.filter(c=>c.stage==='Hired').length,'↗ Successful placements')}</div><div class="split"><div class="card"><h3 class="section-title">Recent candidates</h3><div class="table-wrap"><table><thead><tr><th>Candidate</th><th>Role</th><th>Job</th><th>Stage</th><th></th></tr></thead><tbody>${candidateRows(candidates.slice(-5).reverse())||'<tr><td colspan="5" class="empty">No candidates yet.</td></tr>'}</tbody></table></div></div><div class="card"><h3 class="section-title">Hiring pipeline</h3>${stages.map(s=>{let n=candidates.filter(c=>c.stage===s).length;return `<div class="barrow"><span>${s}</span><div class="bar"><span style="width:${candidates.length?n/candidates.length*100:0}%"></span></div><b>${n}</b></div>`}).join('')}<div class="note">Tip: use AI Matching to compare a candidate’s listed skills against a job’s requirements. Results are decision support, not a hiring decision.</div></div></div>`}
if(page==='Jobs'){v.innerHTML=header('Jobs','Create and manage open roles and their required skills.',btn('+ Add job',"openModal('job')"))+`<div class="toolbar"><input class="search" placeholder="Search title, department, skills…" value="${esc(query)}" oninput="query=this.value;render()"><select onchange="stageFilter=this.value;render()"><option>All</option><option>Open</option><option>Closed</option></select></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Position</th><th>Department</th><th>Location</th><th>Skills required</th><th>Status</th><th></th></tr></thead><tbody>${jobs.filter(j=>(stageFilter==='All'||j.status===stageFilter)&&JSON.stringify(j).toLowerCase().includes(query.toLowerCase())).map(j=>`<tr><td><b>${esc(j.title)}</b><div class="muted">${esc(j.type)}</div></td><td>${esc(j.dept)}</td><td>${esc(j.location)}</td><td>${j.skills.slice(0,3).map(s=>`<span class="pill">${esc(s)}</span>`).join(' ')}${j.skills.length>3?' …':''}</td><td><span class="pill ${j.status==='Open'?'green':''}">${j.status}</span></td><td>${btn('Match',`startMatch(${j.id})`,'secondary')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No jobs match your search.</td></tr>'}</tbody></table></div></div>`}
if(page==='Candidates'){v.innerHTML=header('Candidates','Search your talent pool and keep every application moving.',btn('+ Add candidate',"openModal('candidate')"))+`<div class="toolbar"><input class="search" placeholder="Search name, email, skills, role…" value="${esc(query)}" oninput="query=this.value;render()"><select onchange="stageFilter=this.value;render()"><option>All</option>${stages.map(s=>`<option ${stageFilter===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="card"><div class="table-wrap"><table><thead><tr><th>Candidate</th><th>Current role</th><th>Applied for</th><th>Stage</th><th></th></tr></thead><tbody>${candidateRows(candidates.filter(c=>(stageFilter==='All'||c.stage===stageFilter)&&JSON.stringify(c).toLowerCase().includes(query.toLowerCase())))||'<tr><td colspan="5" class="empty">No candidates match your search.</td></tr>'}</tbody></table></div></div>`}
if(page==='Matching'){if(!jobs.some(j=>j.id==matchJob))matchJob=String(jobs[0]?.id||'');if(!candidates.some(c=>c.id==matchCandidate))matchCandidate=String(candidates[0]?.id||'');let j=jobs.find(x=>x.id==matchJob),c=candidates.find(x=>x.id==matchCandidate);let common=j&&c?j.skills.filter(s=>c.skills.some(k=>k.toLowerCase()===s.toLowerCase())):[],missing=j?j.skills.filter(s=>!common.includes(s)):[],score=j&&j.skills.length?Math.round(common.length/j.skills.length*100):0;
v.innerHTML=header('AI Skill Matching','Compare listed résumé skills with job requirements. Prototype uses transparent keyword matching.')+`<div class="match-layout"><div class="card"><h3 class="section-title">Select a match</h3><div class="field"><label>JOB POSITION</label><select id="matchJobSel" onchange="matchJob=this.value;render()">${jobs.map(j=>`<option value="${j.id}" ${j.id==matchJob?'selected':''}>${esc(j.title)}</option>`).join('')}</select></div><div class="field"><label>CANDIDATE</label><select id="matchCandSel" onchange="matchCandidate=this.value;render()">${candidates.map(c=>`<option value="${c.id}" ${c.id==matchCandidate?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="note">Demo prototype: no external AI model or résumé parser is connected. Only the skills entered in this app are compared. Similar wording may not be recognized.</div></div><div class="card">${j&&c?`<div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="muted">${esc(c.name)} → ${esc(j.title)}</div><h2 style="margin:7px 0">Skill match overview</h2></div><span class="pill purple">DEMO AI</span></div><div class="row" style="gap:22px;margin:18px 0"><div class="matchscore">${score}%</div><div style="flex:1"><b>${common.length} of ${j.skills.length} required skills listed</b><p class="muted" style="margin:5px 0 10px">This score is a simple skills overlap, not a prediction of job performance.</p><div class="progress"><span style="width:${score}%"></span></div></div></div><h3 class="section-title">✓ Matching skills</h3><div>${common.length?common.map(s=>`<span class="skill">${esc(s)}</span>`).join(''):'<span class="muted">No exact skill matches found.</span>'}</div><h3 class="section-title" style="margin-top:22px">? Not confirmed by entered profile</h3><div>${missing.length?missing.map(s=>`<span class="skill missing">${esc(s)}</span>`).join(''):'<span class="muted">All listed requirements have a matching skill entry.</span>'}</div><p class="muted" style="font-size:12px;margin-top:10px">“Not confirmed” means the skill is not in the profile; it does not prove the candidate lacks it. Verify with the candidate.</p><hr style="border:0;border-top:1px solid var(--line);margin:22px 0"><h3 class="section-title">Suggested interview questions</h3><ol>${(missing.length?missing:j.skills).slice(0,4).map(s=>`<li style="margin:9px 0">Can you describe a project or situation where you used <b>${esc(s)}</b>? What was your role and the result?</li>`).join('')}<li style="margin:9px 0">What would you like to learn or develop in this role during your first 90 days?</li></ol><div class="row" style="margin-top:20px">${btn('Update hiring stage',`viewCandidate(${c.id})`)}${btn('View pipeline',"setPage('Pipeline')",'secondary')}</div>`:'<div class="empty">Add at least one job and one candidate to compare skills.</div>'}</div></div>`}
if(page==='Pipeline'){v.innerHTML=header('Hiring Pipeline','Move candidates through each stage and keep the process visible.',btn('+ Add candidate',"openModal('candidate')"))+`<div class="pipeline">${stages.map(s=>{let list=candidates.filter(c=>c.stage===s);return `<div class="stage"><div class="stagehead"><span>${s.toUpperCase()}</span><span class="pill">${list.length}</span></div>${list.map(c=>`<div class="candidate-card"><div class="row"><div class="mini-avatar">${initials(c.name)}</div><span class="muted" style="font-size:11px">${esc(c.experience)}</span></div><strong>${esc(c.name)}</strong><div class="muted" style="font-size:12px">${esc(jobName(c.jobId))}</div><select aria-label="Update ${esc(c.name)} stage" onchange="updateStage(${c.id},this.value)">${stages.map(st=>`<option ${c.stage===st?'selected':''}>${st}</option>`).join('')}</select></div>`).join('')||'<div class="muted" style="font-size:12px;padding:12px 4px">No candidates</div>'}</div>`}).join('')}</div><p class="footerhint">Changes are saved in this browser using local storage. Data is not shared between devices.</p>`}
if(page==='Insights'){let total=candidates.length,hire=candidates.filter(c=>c.stage==='Hired').length;v.innerHTML=header('Recruitment Insights','A quick view of hiring activity based on the records in this browser.')+`<div class="grid">${stats('CANDIDATES',total,'Total talent pool')}${stats('OPEN JOBS',jobs.filter(j=>j.status==='Open').length,'Roles accepting candidates')}${stats('IN INTERVIEW',candidates.filter(c=>c.stage==='Interview').length,'Active interview stage')}${stats('HIRES',hire,total?Math.round(hire/total*100)+'% of candidates':'No candidates yet')}</div><div class="split"><div class="card"><h3 class="section-title">Candidates by stage</h3>${stages.map(s=>{let n=candidates.filter(c=>c.stage===s).length;return `<div class="barrow"><span>${s}</span><div class="bar"><span style="width:${total?n/total*100:0}%"></span></div><b>${n}</b></div>`}).join('')}</div><div class="card"><h3 class="section-title">Skills most often listed</h3>${(()=>{let counts={};candidates.forEach(c=>c.skills.forEach(s=>counts[s]=(counts[s]||0)+1));return Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([s,n])=>`<div class="barrow"><span>${esc(s)}</span><div class="bar"><span style="width:${total?n/total*100:0}%"></span></div><b>${n}</b></div>`).join('')||'<p class="muted">Add candidate skills to see insights.</p>'})()}</div></div><div class="note" style="margin-top:18px">Insights reflect only the records stored in this browser. They are descriptive summaries, not validated predictions or candidate rankings.</div>`}
}
function openModal(type){const back=document.getElementById('modalback'),body=document.getElementById('modalBody');document.getElementById('modalTitle').textContent=type==='job'?'Create a job':'Add a candidate';back.style.display='flex';if(type==='job')body.innerHTML=`<form onsubmit="saveJob(event)"><div class="formgrid"><div class="field span2"><label>JOB TITLE *</label><input name="title" required placeholder="e.g. Policy Research Intern"></div><div class="field"><label>DEPARTMENT *</label><input name="dept" required placeholder="Strategy & Research"></div><div class="field"><label>LOCATION</label><input name="location" placeholder="Tashkent · Hybrid"></div><div class="field"><label>EMPLOYMENT TYPE</label><select name="type"><option>Full-time</option><option>Part-time</option><option>Internship</option><option>Contract</option></select></div><div class="field"><label>STATUS</label><select name="status"><option>Open</option><option>Closed</option></select></div><div class="field span2"><label>REQUIRED SKILLS * (comma separated)</label><textarea name="skills" required placeholder="Research, English, Excel"></textarea></div></div><div class="row" style="justify-content:flex-end">${btn('Cancel','closeModal()','secondary')}<button class="primary" type="submit">Save job</button></div></form>`;
else body.innerHTML=`<form onsubmit="saveCandidate(event)"><div class="formgrid"><div class="field"><label>FULL NAME *</label><input name="name" required placeholder="Candidate name"></div><div class="field"><label>EMAIL *</label><input name="email" type="email" required placeholder="name@example.com"></div><div class="field"><label>CURRENT ROLE</label><input name="role" placeholder="e.g. Research Assistant"></div><div class="field"><label>EXPERIENCE</label><input name="experience" placeholder="e.g. 2 years"></div><div class="field span2"><label>APPLYING FOR</label><select name="jobId">${jobs.map(j=>`<option value="${j.id}">${esc(j.title)}</option>`).join('')}</select></div><div class="field span2"><label>SKILLS LISTED IN PROFILE * (comma separated)</label><textarea name="skills" required placeholder="Research, English, Excel"></textarea></div><div class="field"><label>HIRING STAGE</label><select name="stage">${stages.map(s=>`<option>${s}</option>`).join('')}</select></div></div><div class="row" style="justify-content:flex-end">${btn('Cancel','closeModal()','secondary')}<button class="primary" type="submit">Save candidate</button></div></form>`}
function closeModal(){document.getElementById('modalback').style.display='none'}
function saveJob(e){e.preventDefault();let f=new FormData(e.target);jobs.unshift({id:Date.now(),title:f.get('title').trim(),dept:f.get('dept').trim(),location:f.get('location').trim()||'Not specified',type:f.get('type'),status:f.get('status'),skills:f.get('skills').split(',').map(x=>x.trim()).filter(Boolean),date:new Date().toLocaleDateString()});save();closeModal();toast('Job created and saved');setPage('Jobs')}
function saveCandidate(e){e.preventDefault();let f=new FormData(e.target);if(!jobs.length){toast('Create a job first');return}candidates.unshift({id:Date.now(),name:f.get('name').trim(),email:f.get('email').trim(),role:f.get('role').trim()||'Not specified',experience:f.get('experience').trim()||'Not specified',skills:f.get('skills').split(',').map(x=>x.trim()).filter(Boolean),stage:f.get('stage'),jobId:Number(f.get('jobId'))});save();closeModal();toast('Candidate added and saved');setPage('Candidates')}
function updateStage(id,stage){let c=candidates.find(c=>c.id===id);if(c){c.stage=stage;save();toast('Hiring stage updated');render()}}
function startMatch(id){matchJob=String(id);matchCandidate=String(candidates.find(c=>c.jobId==id)?.id||candidates[0]?.id||'');setPage('Matching')}
function viewCandidate(id){let c=candidates.find(c=>c.id===id);if(!c)return;openModal('candidate');document.getElementById('modalTitle').textContent='Update candidate stage';document.getElementById('modalBody').innerHTML=`<p><b>${esc(c.name)}</b> · ${esc(jobName(c.jobId))}</p><div class="field"><label>HIRING STAGE</label><select id="editStage">${stages.map(s=>`<option ${c.stage===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="row" style="justify-content:flex-end">${btn('Cancel','closeModal()','secondary')}<button class="primary" onclick="updateStage(${c.id},document.getElementById('editStage').value);closeModal()">Save stage</button></div>`}
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
render();
</script></body></html>
